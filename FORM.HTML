<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
  
 <fieldset>
    <legend>BioData</legend>
    <!-- action /target/ name /method  are the attributes of form -->
    <form action="./form sub.html">
     <label for="name"> UserName:</label>
        <input type="text" name="name"  id = "name" placeholder="Enter your name" > <br><br>
       <label for="Password"> Password:</label>
       <input type="Password" name="password" id="pass"  > <br><br>
      <input type =date name="dob" id="dob" > <br><br>
      <label for="gender"> Gender:</label>
       

     <input type="radio" name="gender" id="gender"> <label for="gender">Male</label>
     <input type="radio" name="gender" id="gender"> <label for="gender">Female</label> <br><br>
     <label for="hobb"> Hobbies:</label>
     <input type="checkbox" name="hobb" id="hobb"> <label for="hobb">Reading</label>
     <input type="checkbox" name="hobb" id="hobb"> <label for="hobb">Writing</label>
     <input type="checkbox" name="hobb" id="hobb"> <label for="hobb">Coding</label>
     <br>
     <label for="add" > Address:</label>
        <textarea name="add" id="add" cols="30" rows="10"></textarea> <br><br>
        <label for="tel"> Phone:</label>
        <input type="tel" name="tel" id="tel" > <br><br>
        <label for="email"> Email:</label>
        <input type="email" name="email" id="email" > <br><br>
        <label for="num"> Number:</label>
        <input type="number" name="num" id="num" > <br><br>
        <label for="url">Homepage:</label>
        <input type="url" name="url" id="url" > <br><br>
        <label for="file">ResumeUpload:</label>
        <input type="file" name="file" id="file" > <br><br>
        <label for="submit"> </label>
        <input type="submit" name="submit" id="submit" > 
        <input type="reset" name="reset" id="reset" > 
    </form>
 </fieldset>   
</body>
</html>
